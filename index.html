<style>
  :root {
    --ink: #1c1b1f;
    --paper: #f2ede4;
    --panel: #ffffff;
    --line: #d8d0c0;
    --accent: #c1440e;
    --accent-ink: #7a2c08;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    background-image: radial-gradient(circle at 1px 1px, rgba(28,27,31,0.06) 1px, transparent 0);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  }
  header {
    max-width: 900px;
    margin: 0 auto;
    padding: 64px 24px 32px;
    border-bottom: 3px solid var(--ink);
  }
  .eyebrow {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--accent-ink);
    margin: 0 0 6px;
  }
  h1 {
    font-size: clamp(2.4rem, 6vw, 4rem);
    line-height: 1.02;
    margin: 0 0 12px;
    font-weight: 700;
  }
  header p.sub {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    color: #4a463f;
    max-width: 55ch;
    margin: 0;
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px 100px;
  }
  .concert-head {
    font-size: clamp(1.3rem, 3vw, 1.7rem);
    font-weight: 700;
    margin: 48px 0 18px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--ink);
  }
  .concert-head:first-of-type { margin-top: 0; }
  .concert-name {
    display: block;
    font-size: inherit;
    margin: 0 0 4px;
  }
  .concert-meta {
    display: block;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 13px;
    font-weight: 400;
    color: var(--accent-ink);
    margin: 0;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 28px;
    margin-bottom: 8px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    text-decoration: none;
    color: inherit;
    display: block;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-3px);
    box-shadow: 6px 6px 0 var(--ink);
    outline: none;
  }
  .thumb-wrap {
    position: relative;
    aspect-ratio: 16 / 9;
    background: #111;
    overflow: hidden;
    border-bottom: 1px solid var(--line);
  }
  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .play {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .play svg {
    width: 46px;
    height: 46px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
  }
  .meta {
    padding: 14px 16px 18px;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  .meta .title {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 4px;
    line-height: 1.3;
  }
  .meta .details {
    font-size: 13px;
    color: #6b6558;
    margin: 0;
  }
  footer {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 24px 60px;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 13px;
    color: #8a8474;
  }
  .empty {
    font-family: "Helvetica Neue", Arial, sans-serif;
    color: #6b6558;
    padding: 40px 0;
  }
</style>
</head>
