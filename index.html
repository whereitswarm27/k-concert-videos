<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KJV</title>
<style>
  :root {
    --ink: #f4f1f8;
    --paper: #1b1c20;
    --panel: #24262c;
    --line: #393b43;
    --accent: #f07845;
    --accent-ink: #ffa275;
    --muted: #aaa7b0;
    --subtle: #85828b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 0);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    max-width: 900px;
    margin: 0 auto;
    padding: 64px 24px 32px;
    text-align: center;
  }
  .eyebrow {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--accent-ink);
    margin: 0 0 6px;
  }
  h1 {
    font-size: clamp(1.2rem, 3vw, 2rem);
    line-height: 1.02;
    margin: 0 0 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  h1::after {
    content: "";
    display: block;
    width: 40px;
    height: 2px;
    margin: 12px auto 0;
    background: var(--accent);
  }
  header p.sub {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    color: var(--muted);
    max-width: 55ch;
    margin: 0;
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px 100px;
  }
  .concert-nav {
    position: fixed;
    top: 230px;
    left: max(24px, calc(50% - 540px));
    width: 220px;
    padding: 0 0 0 20px;
    border-left: 1px solid var(--line);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    z-index: 2;
  }
  .concert-nav p {
    display: none;
  }
  .concert-nav a {
    display: block;
    padding: 5px 0 5px 20px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 400;
    line-height: 1.3;
    text-decoration: none;
    border-left: 2px solid transparent;
    margin-left: -21px;
  }
  .concert-nav a:hover,
  .concert-nav a:focus-visible {
    color: var(--ink);
    outline: none;
  }
  .concert-nav a.active {
    color: var(--ink);
    border-left-color: var(--ink);
  }
  @media (min-width: 901px) {
    main,
    footer {
      margin-left: max(240px, calc(50% - 300px));
      margin-right: 24px;
    }
  }
  @media (max-width: 900px) {
    .concert-nav {
      position: static;
      width: auto;
      max-width: 900px;
      margin: 0 auto;
      padding: 12px 24px;
      border-left: 0;
      border-right: 0;
    }
    .concert-nav nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0 18px;
    }
    .concert-nav a {
      border-top: 0;
      border-left: 0;
      margin-left: 0;
      padding: 5px 0;
      text-align: center;
    }
    .concert-nav a.active {
      border-left: 0;
    }
  }
  .concert-head {
    font-size: clamp(1.3rem, 3vw, 1.7rem);
    font-weight: 700;
    margin: 48px 0 18px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .concert-head:first-of-type { margin-top: 0; }
  .concert-name {
    display: block;
    font-size: inherit;
    margin: 0 0 4px;
  }
  .concert-meta {
    display: block;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    font-weight: 400;
    color: var(--muted);
    margin: 0;
  }
  .concert-meta a {
    color: var(--accent-ink);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 28px;
    margin-bottom: 8px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    text-decoration: none;
    color: inherit;
    display: block;
    overflow: hidden;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(240, 120, 69, 0.22);
    outline: none;
  }
  .thumb-wrap {
    position: relative;
    aspect-ratio: 16 / 9;
    background: var(--paper);
    overflow: hidden;
    border-bottom: 1px solid var(--line);
  }
  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .play {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .play svg {
    width: 46px;
    height: 46px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
  }
  .meta {
    padding: 14px 16px 18px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .meta .title {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 4px;
    line-height: 1.3;
  }
  .meta .details {
    font-size: 13px;
    color: var(--muted);
    margin: 0;
  }
  footer {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 24px 60px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    color: var(--subtle);
  }
  .empty {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--muted);
    padding: 40px 0;
  }
</style>
</head>

  if (videos.length === 0) {
    empty.style.display = "block";
  }

  let currentConcert = null;
  let currentGrid = null;

  let concertNumber = 0;

  videos.forEach(v => {
    if (v.concert !== currentConcert) {
      currentConcert = v.concert;
      if (currentConcert) {
        const heading = document.createElement("h2");
        heading.className = "concert-head";
        heading.id = "concert-" + concertNumber;
        const link = document.createElement("a");
        link.href = "#" + heading.id;
        link.textContent = currentConcert;
        if (concertNumber === 0) link.className = "active";
        link.addEventListener("click", () => {
          concertLinks.querySelectorAll("a").forEach(item => item.classList.remove("active"));
          link.classList.add("active");
        });
        concertLinks.appendChild(link);
        concertNumber += 1;
        const name = document.createElement("span");
        name.className = "concert-name";
        name.textContent = currentConcert;
        const meta = document.createElement("span");
        meta.className = "concert-meta";

          playlistLink.textContent = "Playlist";
          playlistLink.target = "_blank";
          playlistLink.rel = "noopener noreferrer";
          meta.appendChild(playlistLink);
          meta.appendChild(document.createTextNode(")"));
        }
        heading.appendChild(name);
        heading.appendChild(meta);
        main.appendChild(heading);
      }
      currentGrid = document.createElement("div");
      currentGrid.className = "grid";
      main.appendChild(currentGrid);
    }

    titleEl.textContent = v.title;
    meta.appendChild(titleEl);

      detailsEl.className = "details";
      detailsEl.textContent = v.details;
      meta.appendChild(detailsEl);
    }
